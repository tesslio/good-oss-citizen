# good-oss-citizen contribution gate
#
# Fails a pull request that does not carry an explicit contribution
# declaration — either an "AI Disclosure" section (the artifact
# good-oss-citizen prepares) or an explicit "no AI assistance" statement —
# and posts a sticky comment explaining how to fix it.
#
# This enforces an OUTCOME (AI use is disclosed, or the contributor declares
# none). It does not, and cannot, prove that any particular tool ran; a
# careful human who writes a disclosure by hand passes by design. See the
# good-oss-citizen "For maintainers" docs for the enforced-vs-nudged framing.
#
# Uses `pull_request_target` (not `pull_request`) so the gate also works on
# pull requests from forks — the common open-source case, where the default
# `pull_request` token is read-only and cannot comment. This is safe here
# because the job NEVER checks out or executes PR code: it checks out the
# trusted base repo and evaluates the PR *body* (passed as event data, never
# interpolated into a shell) with the base repo's vendored script.
name: good-oss-citizen contribution gate

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: good-oss-citizen-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  declaration:
    name: Contribution declaration
    runs-on: ubuntu-latest
    steps:
      # Checks out the base repository (the default ref for
      # pull_request_target), so the detection script is the trusted,
      # reviewed version — not whatever the PR proposes.
      - uses: actions/checkout@v4

      - name: Evaluate contribution declaration
        id: gate
        env:
          # GitHub injects the PR body as a real environment variable, so it
          # is never interpolated into the shell command line — no injection
          # surface even though the body is untrusted contributor input.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -o pipefail
          python3 .github/scripts/check_contribution_declaration.py > "$RUNNER_TEMP/gate.json" || true
          python3 - "$RUNNER_TEMP/gate.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))["data"]
          print(f"verdict={data['verdict']}")
          print("reasons<<__REASONS__")
          for reason in data["reasons"]:
              print(f"- {reason}")
          print("__REASONS__")
          PY

      - name: Post sticky comment
        uses: actions/github-script@v7
        env:
          VERDICT: ${{ steps.gate.outputs.verdict }}
          REASONS: ${{ steps.gate.outputs.reasons }}
        with:
          script: |
            const marker = '<!-- good-oss-citizen-contribution-gate -->';
            const verdict = process.env.VERDICT;
            const reasons = process.env.REASONS || '';
            let body;
            if (verdict === 'pass') {
              body = `${marker}\n### good-oss-citizen contribution gate — passed\n\n`
                + `A contribution declaration was found. Thanks for being a good OSS citizen!`;
            } else {
              body = `${marker}\n### good-oss-citizen contribution gate — action needed\n\n`
                + `This pull request does not declare how it was produced. Please edit the PR description to include **one** of:\n\n`
                + `- an **AI Disclosure** section describing what was AI-assisted and confirming you reviewed it, or\n`
                + `- a checked "written without AI assistance" box.\n\n`
                + `${reasons}\n\n`
                + `Using an AI agent? Install good-oss-citizen — it prepares a compliant, disclosed PR for you:\n\n`
                + '```\ntessl install tessl-labs/good-oss-citizen\n```\n\n'
                + `If this repository declares good-oss-citizen in its \`tessl.json\`, a tessl-aware agent installs it automatically.`;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Enforce declaration
        if: steps.gate.outputs.verdict != 'pass'
        run: |
          echo "::error title=Contribution declaration missing::Add an AI Disclosure section or check the no-AI box in the PR description. See the sticky comment on this PR for details." >&2
          exit 1
