name: Review Skills

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - main
    # Match the whole skill tree, not just SKILL.md — a skill's scripts,
    # reference files, and rubrics are review surface too, and the
    # changed-skills loop below must run when any of them change.
    paths:
      - 'plugins/**/skills/**'

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Tessl CLI
        uses: tesslio/setup-tessl@v2
        with:
          # Explicit version pin — `version: latest` resolves via
          # `https://install.tessl.io/scripts/latest.sh` which returns
          # empty content from some GitHub Actions runners (reproduced
          # twice). Pin until upstream setup-tessl exposes a more
          # reliable resolution mechanism or the install endpoint stops
          # serving empty bodies.
          version: "0.77.0"
          token: ${{ secrets.TESSL_TOKEN }}

      # Per `jbaruch/coding-policy: context-artifacts` (Mandatory Review) —
      # wire skill review as a changed-skills loop (review only skills changed
      # in this PR), not static per-skill steps. The canonical composite action
      # diffs `base-ref..HEAD` under `skills-dir` and reviews each changed skill
      # at `--threshold 85`; new/removed skills are picked up automatically.
      - name: Review changed skills
        uses: jbaruch/coding-policy/.github/actions/skill-review@23c86ae16b3edd234275e08f55f64c6f1afb5583
        with:
          threshold: "85"
          skills-dir: plugins/good-oss-citizen/skills
          base-ref: ${{ github.event.pull_request.base.sha }}
